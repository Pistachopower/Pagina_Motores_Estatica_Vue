name: Deploy Vue app to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Pagina_Motores_Estatica_Vue/package-lock.json

      - name: Install dependencies
        working-directory: Pagina_Motores_Estatica_Vue
        run: npm ci

      - name: Build
        working-directory: Pagina_Motores_Estatica_Vue
        run: npm run build

      - name: Add SPA fallback
        run: cp Pagina_Motores_Estatica_Vue/dist/index.html Pagina_Motores_Estatica_Vue/dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Pagina_Motores_Estatica_Vue/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4